<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17110e">
<title>كالوشا | منيو العربية</title>
<style>
:root{--bg:#100d0b;--panel:#1e1713;--panel2:#291d17;--red:#d92720;--gold:#ffbf27;--cream:#fff4df;--muted:#c6b6a3}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#492017 0,#100d0b 48%);color:var(--cream);font-family:Tahoma,Arial,sans-serif}
header{padding:26px 18px 22px;text-align:center;background:linear-gradient(135deg,#3a1712,#17110e 65%);border-bottom:3px solid var(--gold)}
.logo{display:inline-block;border:2px solid var(--gold);border-radius:18px;padding:10px 24px;box-shadow:0 8px 28px #0008}
.logo small{display:block;color:var(--gold);font-size:13px;letter-spacing:2px}.logo h1{margin:2px 0;font-size:42px;color:#fff;text-shadow:3px 4px 0 #a91b14}.tag{margin:13px 0 0;color:#ffe1a3}
.wrap{max-width:900px;margin:auto;padding:18px 14px 100px}.notice{background:#382018;border:1px solid #75402b;border-radius:14px;padding:12px;text-align:center;color:#ffdfaa;font-size:14px}
.tabs{display:flex;gap:8px;overflow:auto;padding:16px 0;scrollbar-width:none}.tabs button{white-space:nowrap;border:1px solid #68402b;background:#211813;color:var(--cream);border-radius:22px;padding:10px 16px;font-weight:bold}.tabs button.active{background:var(--gold);color:#24140b;border-color:var(--gold)}
h2{font-size:21px;margin:18px 2px 12px;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.item{background:linear-gradient(145deg,#2a201a,#191310);border:1px solid #503326;border-radius:16px;padding:14px;min-height:150px;display:flex;flex-direction:column}
.foodicon{font-size:34px}.item h3{font-size:17px;margin:8px 0 5px}.desc{font-size:12px;color:var(--muted);line-height:1.6;min-height:34px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:12px}.price{font-size:13px;color:var(--gold);font-weight:bold}.add{background:var(--red);color:white;border:0;border-radius:10px;padding:9px 12px;font-weight:bold}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#201711;border-top:1px solid #73502a;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:5}.cartbar strong{color:var(--gold)}.checkout{background:var(--gold);color:#21140d;border:0;border-radius:12px;padding:12px 17px;font-weight:bold}
.cartbox{display:none;background:#211813;border:1px solid #65402a;border-radius:15px;padding:14px;margin:10px 0}.cartrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #493126;font-size:14px}.empty{color:var(--muted);text-align:center;padding:10px}
footer{text-align:center;color:#a99582;font-size:12px;margin-top:28px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.logo h1{font-size:50px}}
</style>
</head>
<body>
<header>
  <div class="logo"><small>عربية أكل مصري</small><h1>كالوشا</h1><small>كبدة • سجق • حواوشي</small></div>
  <p class="tag">طعم الشارع الأصيل… معمول بحب ❤️</p>
</header>
<main class="wrap">
  <div class="notice">اختار أكلك واضغط «أضف للطلب» — الأسعار قابلة للتعديل قبل النشر</div>
  <nav class="tabs" id="tabs">
    <button class="active" data-cat="all">كل الأصناف</button>
    <button data-cat="kebda">الكبدة</button>
    <button data-cat="sojuk">السجق</button>
    <button data-cat="hawawshi">الحواوشي</button>
    <button data-cat="sandwich">السندوتشات</button>
    <button data-cat="extras">إضافات</button>
    <button data-cat="drinks">مشروبات</button>
  </nav>
  <section id="menu" class="grid"></section>
  <h2>🧾 طلبك</h2>
  <section class="cartbox" id="cartbox"><div id="cartitems"></div><div class="cartrow"><strong>الإجمالي</strong><strong id="total">0 جنيه</strong></div></section>
  <footer>كالوشا — منيو إلكتروني تجريبي. حدّث الأسعار ورقم واتساب قبل مشاركة الرابط.</footer>
</main>
<div class="cartbar"><div>عدد الأصناف: <strong id="count">0</strong> · الإجمالي: <strong id="barTotal">0 ج</strong></div><button class="checkout" onclick="sendOrder()">إرسال الطلب</button></div>
<script>
const products=[
 {id:1,cat:'kebda',icon:'🍳',name:'كبدة إسكندراني',desc:'كبدة متشوّحة بالفلفل والبهارات',price:0},
 {id:2,cat:'kebda',icon:'🥘',name:'كبدة بلدي',desc:'كبدة بلدي بتتبيلة كالوشا',price:0},
 {id:3,cat:'kebda',icon:'🥖',name:'ساندوتش كبدة',desc:'عيش طازة وحشوة كبدة سخنة',price:0},
 {id:4,cat:'sojuk',icon:'🌭',name:'سجق شرقي',desc:'سجق بالبصل والفلفل',price:0},
 {id:5,cat:'sojuk',icon:'🔥',name:'سجق حار',desc:'لعشاق الطعم الحراق',price:0},
 {id:6,cat:'sojuk',icon:'🥖',name:'ساندوتش سجق',desc:'سجق شرقي في عيش طازة',price:0},
 {id:7,cat:'hawawshi',icon:'🥙',name:'حواوشي كالوشا',desc:'خلطة مميزة وتسوية على الطلب',price:0},
 {id:8,cat:'hawawshi',icon:'🥙',name:'حواوشي سجق',desc:'حواوشي بحشوة السجق',price:0},
 {id:9,cat:'sandwich',icon:'🥪',name:'ساندوتش ميكس',desc:'كبدة وسجق في ساندوتش واحد',price:0},
 {id:10,cat:'sandwich',icon:'🍞',name:'ساندوتش بطاطس',desc:'بطاطس محمرة مع الإضافات',price:0},
 {id:11,cat:'extras',icon:'🍟',name:'بطاطس محمرة',desc:'بطاطس مقرمشة',price:0},
 {id:12,cat:'extras',icon:'🥒',name:'مخلل وطحينة',desc:'إضافات على مزاجك',price:0},
 {id:13,cat:'drinks',icon:'🥤',name:'كانز',desc:'مشروب غازي',price:0},
 {id:14,cat:'drinks',icon:'💧',name:'مياه',desc:'مياه معدنية',price:0}
];
let cart={};let current='all';
const menu=document.getElementById('menu');
function render(){
 const shown=products.filter(p=>current==='all'||p.cat===current);
 menu.innerHTML=shown.map(p=>`<article class="item"><div class="foodicon">${p.icon}</div><h3>${p.name}</h3><div class="desc">${p.desc}</div><div class="bottom"><span class="price">${p.price? p.price+' جنيه':'السعر يضاف'}</span><button class="add" onclick="add(${p.id})">+ أضف للطلب</button></div></article>`).join('');
}
function add(id){cart[id]=(cart[id]||0)+1;updateCart()}
function updateCart(){
 const entries=Object.entries(cart);let count=0,total=0;
 entries.forEach(([id,q])=>{const p=products.find(x=>x.id==id);count+=q;total+=p.price*q});
 document.getElementById('count').textContent=count;
 document.getElementById('total').textContent=total+' جنيه';
 document.getElementById('barTotal').textContent=total+' ج';
 const box=document.getElementById('cartbox');box.style.display=entries.length?'block':'none';
 document.getElementById('cartitems').innerHTML=entries.map(([id,q])=>{const p=products.find(x=>x.id==id);return `<div class="cartrow"><span>${p.name} × ${q}</span><button class="add" onclick="removeOne(${id})">حذف</button></div>`}).join('');
}
function removeOne(id){if(cart[id]>1)cart[id]--;else delete cart[id];updateCart()}
document.getElementById('tabs').addEventListener('click',e=>{if(e.target.matches('button')){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');current=e.target.dataset.cat;render()}});
function sendOrder(){
 if(!Object.keys(cart).length){alert('اختار صنف الأول');return}
 const lines=Object.entries(cart).map(([id,q])=>{const p=products.find(x=>x.id==id);return `${p.name} × ${q}`});
 const total=Object.entries(cart).reduce((s,[id,q])=>s+products.find(p=>p.id==id).price*q,0);
 const msg=`طلب جديد من منيو كالوشا:%0A${encodeURIComponent(lines.join('\n'))}%0Aالإجمالي: ${total} جنيه`;
 // استبدل الرقم التالي برقم واتساب المطعم بصيغة دولية بدون +
 const phone='201000000000';
 if(phone==='201000000000'){alert('المنيو جاهز للتجربة. قبل النشر غيّر رقم واتساب التجريبي داخل الكود إلى رقم المطعم.');return}
 location.href=`https://wa.me/${phone}?text=${msg}`;
}
render();
</script>
</body>
</html>
